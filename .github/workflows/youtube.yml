
name: YouTube Shorts Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

      - name: Generate the Short
        run: python generate.py

      - name: Save video for download
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: output/short.mp4
          if-no-files-found: error
          retention-days: 3
